<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI 组件状态样本</title>
<link rel="stylesheet" href="color-tokens.css"><link rel="stylesheet" href="../game.css"><link rel="stylesheet" href="../game-palette.css">
<style>
body{height:auto;overflow:auto;padding:16px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}.sample-label{font-size:12px;color:var(--text-secondary);margin:0 0 10px}.sample-buttons{display:grid;gap:10px}.sample-buttons button{text-align:left}h2{font-size:20px;margin:0 0 10px}.panel-head{width:100%;border-radius:0;text-align:left}.panel-head:hover{background:var(--action-subtle)}.node{margin-bottom:10px}.sample-feedback{min-height:22px;font-size:12px}@media(max-width:740px){main{grid-template-columns:1fr}}
</style></head><body><main>
<section class="panel"><button class="panel-head" aria-expanded="true"><span class="panel-title">动作与折叠面板</span><span class="fold"></span></button><div class="panel-body"><p class="sample-label">默认 / 悬停 / 按下 / 键盘焦点 / 禁用</p><div class="sample-buttons"><button class="primary" data-demo="雇工操作反馈">雇第 1 名工人<small>500 金币 · 每回合自动多 1 件</small></button><button data-demo="手工生产反馈">手工生产 1 件原木</button><button class="primary" disabled>升级到 Lv.2<small>金币不足 · 需要 5,000 金币</small></button></div><details class="more"><summary>管理建筑</summary><div class="actions"><button data-demo="修路操作反馈">从这里修路</button><button class="danger" data-demo="拆除操作反馈">拆除建筑<small>全额退款</small></button></div></details><p class="sample-feedback" role="status">交互仅演示反馈。</p></div></section>
<section class="panel"><button class="panel-head" aria-expanded="true"><span class="panel-title">产线诊断</span><span class="fold"></span></button><div class="panel-body"><h2>锯木厂</h2><div class="subtitle">草地 · 原木 → 木板</div><div class="state wait">缺原木</div><div class="flow"><div class="frow hot"><span class="flbl">原木输入</span><span class="fbar"><i class="none" style="width:0%"></i></span><span class="fnum">0 / 3</span><span class="fsrc">缺少输入，连接伐木营。</span></div><div class="frow"><span class="flbl">生产</span><span class="fbar"><i class="short" style="width:33%"></i></span><span class="fnum">1 / 3</span></div><div class="frow"><span class="flbl">收购</span><span class="fbar"><i class="ok" style="width:100%"></i></span><span class="fnum">3 / 3</span></div></div><div class="verdict warn"><b>缺少原木</b><span>检查上游产量与连接路线。</span></div><div class="verdict ok"><b>产线运转正常</b><span>正常状态示例。</span></div><div class="verdict"><b>近期数据</b><span>按近 30 回合观察产出与运出。</span></div></div></section>
<section class="panel"><button class="panel-head" aria-expanded="true"><span class="panel-title">科技卡片</span><span class="fold"></span></button><div class="panel-body"><div class="node ready kind-building"><h3>锯木厂</h3><p>可解锁 · 原木加工成木板</p><button class="primary" data-demo="科技解锁反馈">解锁<small>3,000 金币</small></button></div><div class="node owned kind-building"><h3>伐木营 · Lv.1</h3><div class="craft-now">每名工人每回合 1 件</div><button data-demo="工艺升级反馈">升级到 Lv.2</button></div><div class="node kind-building"><h3>铁厂</h3><div class="locked-note">需要先解锁矿山</div></div></div></section>
</main><script>
document.querySelectorAll('.panel-head').forEach(button=>button.onclick=()=>{const collapsed=button.closest('.panel').classList.toggle('collapsed');button.setAttribute('aria-expanded',String(!collapsed));});
document.querySelectorAll('[data-demo]').forEach(button=>button.onclick=()=>{document.querySelector('.sample-feedback').textContent=button.dataset.demo+' · 示例不影响游戏';});
</script></body></html>
